# C-342: the companion's site, built at every push to main and put on the `site` release (site.tar.gz, site-commit.txt),
# which the hub fetches by itself (server/src/sitefetch.ts) -- so nobody runs ./syncCompanion.sh site any more.
name: site
on:
  push:
    branches: [main]
    paths: ["app/**", "server/src/**", "server/data/**", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npx expo export -p web --output-dir dist
        working-directory: app
        env: { EXPO_PUBLIC_DAEMONS_SERVER: origin }
      - name: pack
        run: |
          echo "$GITHUB_SHA" > app/dist/site-commit.txt
          tar -czf site.tar.gz -C app/dist .
          echo "$GITHUB_SHA" > site-commit.txt
      - name: publish to the site release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view site >/dev/null 2>&1 || gh release create site --title "The site (built at every push)" \
            --notes "The companion's site, built by .github/workflows/site.yml; the hub fetches it by itself (C-342)." --prerelease
          gh release upload site site.tar.gz --clobber        # the build first, then the name the hub looks for
          gh release upload site site-commit.txt --clobber
