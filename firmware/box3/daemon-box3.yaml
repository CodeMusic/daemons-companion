  - { <<: *face, id: face_error_1, placeholder: casita_error }
  - { <<: *face, id: face_muted_0, placeholder: casita_idle }
  - { <<: *face, id: face_muted_1, placeholder: casita_idle }
  - { <<: *face, id: face_timer_0, placeholder: casita_timer_finished }
  - { <<: *face, id: face_timer_1, placeholder: casita_timer_finished }

