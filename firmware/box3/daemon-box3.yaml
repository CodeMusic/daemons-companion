  - platform: file
    file: ${timer_finished_illustration_file}
    id: casita_timer_finished
    resize: 320x240
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: ${loading_illustration_file}
    id: casita_initializing
    resize: 320x240
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: https://github.com/esphome/wake-word-voice-assistants/raw/a159d9aae35a4d0123aa0bc1d2ceaa5357c6cbad/error_box_illustrations/error-no-wifi.png
    id: error_no_wifi
    resize: 320x240
    type: RGB
    transparency: alpha_channel
  - platform: file
    file: https://github.com/esphome/wake-word-voice-assistants/raw/a159d9aae35a4d0123aa0bc1d2ceaa5357c6cbad/error_box_illustrations/error-no-ha.png
    id: error_no_ha
    resize: 320x240
    type: RGB
    transparency: alpha_channel
  # C-138: the daemon's face, a picture a phase and frame, drawn by the companion (its address is set at run time)
  - <<: &face
      platform: online_image
      url: http://companion.local:4730/art/face/idle-0.png
      format: PNG
      type: RGB565
      buffer_size: 16384
      on_download_finished:
        - lambda: id(face_waiting) = false;
      on_error:
        - lambda: id(face_waiting) = false;
    id: face_idle_0
    placeholder: casita_idle
  - { <<: *face, id: face_idle_1, placeholder: casita_idle }
  - { <<: *face, id: face_listening_0, placeholder: casita_listening }
  - { <<: *face, id: face_listening_1, placeholder: casita_listening }
