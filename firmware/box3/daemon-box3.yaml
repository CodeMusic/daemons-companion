text_sensor:
  - id: text_request
    platform: template
  - id: text_response
    platform: template
  # C-138: which daemon is in the box, for Home Assistant
  - id: daemon_name
    platform: template
    name: Daemon
    icon: "mdi:ghost"

color:
  - id: loading_color
    hex: "000000"
  - id: active_timer_color
    hex: "26ed3a"
  - id: paused_timer_color
    hex: "3b89e3"

spi:
  - id: spi_bus
    clk_pin: 7
    mosi_pin: 6

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: S3BOX
    invert_colors: false
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 4
    reset_pin:
      number: 48
      inverted: true
    update_interval: never
    pages:
      # C-138: every voice phase -- the daemon in its den in that phase's picture, the frame the interval chose; its name
      # at the top left; what was asked (thinking) or answered (replying) on the floor, two lines
      - id: face_page
        lambda: |-
          int p = id(voice_assistant_phase);
          int i = p == ${voice_assist_listening_phase_id} ? 1 : p == ${voice_assist_thinking_phase_id} ? 2
                : p == ${voice_assist_replying_phase_id} ? 3 : p == ${voice_assist_error_phase_id} ? 4
                : p == ${voice_assist_muted_phase_id} ? 5 : p == ${voice_assist_timer_finished_phase_id} ? 6 : 0;
          image::Image *faces[7][2] = {
            { id(face_idle_0), id(face_idle_1) }, { id(face_listening_0), id(face_listening_1) },
            { id(face_thinking_0), id(face_thinking_1) }, { id(face_replying_0), id(face_replying_1) },
            { id(face_error_0), id(face_error_1) }, { id(face_muted_0), id(face_muted_1) }, { id(face_timer_0), id(face_timer_1) } };
          // The casita stands on white while listening, thinking and replying, as ESPHome's own; the den fills the screen
          it.fill(!id(face_has) && i >= 1 && i <= 3 ? Color::WHITE : Color::BLACK);
          it.image(0, 0, faces[i][id(face_frame) & 1]);
          if (id(face_has) && !id(face_name).empty()) {
            it.print(11, 11, id(font_name), Color(0, 0, 0), id(face_name).c_str());
            it.print(10, 10, id(font_name), Color(255, 255, 255), id(face_name).c_str());
          }
          const std::string said = i == 2 ? id(text_request).state : i == 3 ? id(text_response).state : "";
          if (!said.empty()) {
            // Two lines of about forty letters, broken at a space; the rest, when there is more, ends "..."
            const size_t W = 40;
            std::string a = said, b;
            if (a.size() > W) {
              size_t cut = a.rfind(' ', W);
              if (cut == std::string::npos || cut < W / 2) cut = W;
              b = a.substr(cut);
              a = a.substr(0, cut);
              while (!b.empty() && b[0] == ' ') b.erase(0, 1);
              if (b.size() > W) b = b.substr(0, W - 3) + "...";
            }
            Color ink = id(face_has) ? Color(255, 255, 255) : Color(0, 0, 0), shade = id(face_has) ? Color(0, 0, 0) : Color(255, 255, 255);
            it.print(161, 203, id(font_said), shade, TextAlign::TOP_CENTER, a.c_str());
            it.print(160, 202, id(font_said), ink, TextAlign::TOP_CENTER, a.c_str());
            if (!b.empty()) {
              it.print(161, 221, id(font_said), shade, TextAlign::TOP_CENTER, b.c_str());
              it.print(160, 220, id(font_said), ink, TextAlign::TOP_CENTER, b.c_str());
            }
          }
          if (i == 0 || i == 5) { id(draw_timer_timeline).execute(); id(draw_active_timer_widget).execute(); }
          else if (i <= 3) id(draw_timer_timeline).execute();
      - id: no_ha_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_ha), ImageAlign::CENTER);
      - id: no_wifi_page
        lambda: |-
          it.image((it.get_width() / 2), (it.get_height() / 2), id(error_no_wifi), ImageAlign::CENTER);
      - id: initializing_page
        lambda: |-
          it.fill(id(loading_color));
          it.image((it.get_width() / 2), (it.get_height() / 2), id(casita_initializing), ImageAlign::CENTER);
