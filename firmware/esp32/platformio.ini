; C-26: the companion on the LilyGO T-Embed CC1101 (ESP32-S3, 16 MB flash, octal PSRAM, ST7789 170x320).
; Pins and display settings are LilyGO's own (Xinyuan-LilyGO/T-Embed-CC1101: examples/utilities.h and
; lib/TFT_eSPI/User_Setups/Setup214_LilyGo_T_Embed_PN532.h), checked 2026-10-04.
;
;   pio run                  build
;   pio run -t upload        flash (see FLASHING.md)
;   pio device monitor       watch it talk

[env:t-embed-cc1101]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
    ; C-28's radios: TOUCHSTONE (the PN532), FLARE (IR), WHISPER (Bluetooth Low Energy)
    adafruit/Adafruit PN532@1.3.4
    crankyoldgit/IRremoteESP8266@2.8.6
    h2zero/NimBLE-Arduino@1.4.3
    ; C-38: the ring of lights (as LilyGO's own ws2812 test drives it)
    adafruit/Adafruit NeoPixel@1.12.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI, configured here rather than in its own User_Setup.h (LilyGO's Setup214)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_INVERSION_ON=1
    -DTFT_BL=21
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
