; The companion's devices: the LilyGO T-Embeds and the T-Watch S3 (ESP32-S3, 16 MB flash, octal PSRAM).
; Pins are LilyGO's own, collected in src/board.cpp and docs/HARDWARE.md.

; C-67: one project, a build per kind of board. env:t-embed runs on all three T-Embeds (CC1101, plain, SI4732): they tell themselves
; apart at start (src/board.cpp). env:t-watch-s3 is the watch. The screen is LovyanGFX, its pins set at run time.
;
;   pio run -e t-embed            build (pio run builds both)
;   pio run -e t-embed -t upload  flash (or ./updateCompanion.sh, which knows what is plugged in)

[common]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:build_stamp.py   ; C-91: COMPANION_BUILD, the commit and when
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    bblanchon/ArduinoJson@7.2.1
    ; C-28's radios: TOUCHSTONE (the PN532), FLARE (IR), WHISPER (Bluetooth Low Energy)
    adafruit/Adafruit PN532@1.3.4
    crankyoldgit/IRremoteESP8266@2.8.6
    h2zero/NimBLE-Arduino@1.4.3
    ; C-38: the ring of lights -- WS2812 (the CC1101) or APA102 (the plain T-Embed)
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit DotStar@1.2.5
    ; C-69: the SI4732's AM/FM (LilyGO's own example uses it)
    pu2clr/PU2CLR SI4735@2.1.8
    ; LONGWAVE: the CC1101's Sub-GHz radio (LilyGO's own examples use it)
    jgromes/RadioLib@7.8.1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

[env:t-embed]
extends = common

; C-74: the M5Stack StickS3 (ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM). Its pins and its power chip (the
; M5PM1) from M5Stack's own docs.m5stack.com/en/core/StickS3 and the M5GFX / M5Unified sources (src/board.cpp says which).
[env:m5-sticks3]
extends = common
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags = ${common.build_flags} -DBOARD_STICKS3=1

; C-75: the M5Stack CoreS3 (and the CoreS3 SE): 16 MB flash and 8 MB PSRAM -- quad, not octal, as PlatformIO's own
; m5stack-cores3 board says. It shares the watch's power chip, clock and touch (src/watch.cpp), so the watch's libraries.
[env:m5-cores3]
extends = common
board_build.arduino.memory_type = qio_qspi
build_flags = ${common.build_flags} -DBOARD_CORES3=1
; C-98: the screen is started by M5Stack's own M5GFX (LovyanGFX's fork, the same drawing API), which tells the CoreS3's
; two panels apart (ILI9342C or E) by reading them back, resets it and inverts it as the board needs; LovyanGFX is left out
lib_ignore = LovyanGFX
lib_deps =
    m5stack/M5GFX@0.2.32
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit PN532@1.3.4
    crankyoldgit/IRremoteESP8266@2.8.6
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit DotStar@1.2.5
    pu2clr/PU2CLR SI4735@2.1.8
    jgromes/RadioLib@7.8.1
    lewisxhe/XPowersLib@0.3.3
    lewisxhe/SensorLib@0.3.4

; C-75: the M5Stack M5GO and Fire -- the ORIGINAL ESP32, not an S3: their own platform settings, not [common]'s. One
; build for both (the Fire is told by its PSRAM): PlatformIO's m5stack-core-esp32 board (4 MB, which both have at least),
; the app partition big enough for this firmware (huge_app: no OTA, which nothing here uses), PSRAM switched on for the
; Fire as PlatformIO's own m5stack-fire board does, and the serial port a USB chip's (no USB CDC on this ESP32).
[env:m5-core]
platform = ${common.platform}
extra_scripts = ${common.extra_scripts}
framework = arduino
board = m5stack-core-esp32
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags =
    -DBOARD_M5CORE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
; Its instruction RAM is nearly full (about 400 bytes free, 2026-10-08): this SDK puts Bluetooth's controller, libc's time
; and stdio and the drivers there. src/esp32_classic.cpp, leds.cpp and radios.cpp each say what was moved out to fit; a
; new IRAM_ATTR, or a new driver, may not fit -- "region iram0_0_seg overflowed" is this.

; C-104: the LilyGO T-Deck and T-Deck Plus (ESP32-S3, 16 MB flash, 8 MB octal PSRAM): the screen's pins, its keyboard,
; trackball and SX1262 are LilyGO's (src/board.cpp); the T-Deck Plus is the same board with a GPS and a bigger battery.
[env:t-deck]
extends = common
build_flags = ${common.build_flags} -DBOARD_TDECK=1

; C-105: the LilyGO T-Display-S3 Pro (ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM): a 222x480 ST7796 IPS screen, CST226SE
; touch, three buttons, an SY6970 charger; no speaker or microphone. Pins are LilyGO's (src/board.cpp, docs/HARDWARE.md).
; The touch (SensorLib's CST226SE) and the charger (XPowersLib's SY6970) are the watch's libraries.
[env:t-display-pro]
extends = common
build_flags = ${common.build_flags} -DBOARD_TDISPLAY_PRO=1
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@0.3.3
    lewisxhe/SensorLib@0.3.4

[env:t-watch-s3]
extends = common
build_flags = ${common.build_flags} -DBOARD_TWATCH_S3=1
; C-71: the watch's power chip (it switches the screen's rails), and its clock, step counter and touch
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@0.3.3
    lewisxhe/SensorLib@0.3.4

; C-102: the M5Stack Dial -- an M5StampS3 (ESP32-S3FN8: 8 MB flash, NO PSRAM) behind a round 1.28" GC9A01 (240x240),
; a rotary knob (A 41, B 40) that presses as its button (42), touch (FT3267, 0x38), a clock (RTC8563, 0x51), an RFID
; reader (WS1850S, the MFRC522's registers, 0x28) and a passive buzzer (3); its power held on by GPIO 46. The screen is
; started by M5Stack's M5GFX, which knows the Dial, as on the CoreS3; the clock and touch through watch.cpp.
[env:m5-dial]
extends = common
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DBOARD_DIAL=1
lib_ignore = LovyanGFX
lib_deps =
    m5stack/M5GFX@0.2.32
    bblanchon/ArduinoJson@7.2.1
    adafruit/Adafruit PN532@1.3.4
    crankyoldgit/IRremoteESP8266@2.8.6
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit DotStar@1.2.5
    pu2clr/PU2CLR SI4735@2.1.8
    jgromes/RadioLib@7.8.1
    lewisxhe/XPowersLib@0.3.3
    lewisxhe/SensorLib@0.3.4
