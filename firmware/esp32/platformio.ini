; The companion's devices: the LilyGO T-Embeds and the T-Watch S3 (ESP32-S3, 16 MB flash, octal PSRAM).
; Pins are LilyGO's own, collected in src/board.cpp and docs/HARDWARE.md.

; C-67: one project, two builds. env:t-embed runs on all three T-Embeds (CC1101, plain, SI4732): they tell themselves
; apart at start (src/board.cpp). env:t-watch-s3 is the watch. The screen is LovyanGFX, its pins set at run time.
;
;   pio run -e t-embed            build (pio run builds both)
;   pio run -e t-embed -t upload  flash (or ./updateCompanion.sh, which knows what is plugged in)

[common]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@1.1.16
    bblanchon/ArduinoJson@7.2.1
    ; C-28's radios: TOUCHSTONE (the PN532), FLARE (IR), WHISPER (Bluetooth Low Energy)
    adafruit/Adafruit PN532@1.3.4
    crankyoldgit/IRremoteESP8266@2.8.6
    h2zero/NimBLE-Arduino@1.4.3
    ; C-38: the ring of lights -- WS2812 (the CC1101) or APA102 (the plain T-Embed)
    adafruit/Adafruit NeoPixel@1.12.3
    adafruit/Adafruit DotStar@1.2.5
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

[env:t-embed]
extends = common

[env:t-watch-s3]
extends = common
build_flags = ${common.build_flags} -DBOARD_TWATCH_S3=1
; C-71: the watch's power chip (it switches the screen's rails), and its clock, step counter and touch
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@0.3.3
    lewisxhe/SensorLib@0.3.4
