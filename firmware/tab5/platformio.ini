; C-77: the M5Stack Tab5 -- the control center (docs/TAB5.md). Its own project, not firmware/esp32's: the Tab5 is an
; ESP32-P4 (its Wi-Fi and Bluetooth an ESP32-C6 beside it, through ESP-Hosted), which needs Arduino 3.3 on ESP-IDF 5.5 --
; pioarduino's platform, with its own m5stack-tab5-p4 board -- where the handhelds are built on Arduino 2.0 (IDF 4.4).
; The screen, touch, sound, microphone and power are M5Stack's own libraries: M5GFX knows the Tab5's three panels and two
; touch chips; LVGL draws the screens on it.
;
;   pio run                 build
;   pio run -t upload       flash (hold RST two seconds for download mode if it will not connect)

[env:m5-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = m5stack-tab5-p4
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -DCORE_DEBUG_LEVEL=1
